<style>
  :root{
    --bg:#0f1220; --bg2:#1a1f38; --acc:#ffd166; --ok:#2ecc71;
    --bad:#e74c3c; --blue:#4a90e2; --card:#232a4d; --txt:#eef2ff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Segoe UI',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#2b3266,transparent),
               radial-gradient(1000px 500px at 110% 110%,#3a1f66,transparent),
               var(--bg);
    color:var(--txt);min-height:100vh;
  }
  header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);
    border-bottom:1px solid #333a66;position:sticky;top:0;z-index:50;
  }
  header h1{margin:0;font-size:1.15rem;letter-spacing:.5px;}
  header h1 span{color:var(--acc);}
  .badge{background:var(--blue);padding:5px 12px;border-radius:20px;font-size:.85rem;}
  .container{max-width:1200px;margin:0 auto;padding:22px;}

  .login-wrap{display:flex;flex-direction:column;gap:14px;max-width:420px;margin:60px auto;
    background:var(--card);padding:28px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .login-wrap h2{margin:0 0 8px;}
  input,select,textarea,button{font:inherit;}
  input,select,textarea{
    padding:11px 14px;border-radius:10px;border:1px solid #3a4270;
    background:#141830;color:var(--txt);outline:none;width:100%;
  }
  input:focus,select:focus{border-color:var(--blue);}
  button{
    padding:11px 18px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#4a90e2,#7b5cff);color:#fff;font-weight:600;
    transition:transform .12s ease,filter .2s;
  }
  button:hover{transform:translateY(-1px);filter:brightness(1.1);}
  button.ghost{background:#2a3054;}
  button.ok{background:linear-gradient(135deg,#2ecc71,#27ae60);}
  button.danger{background:linear-gradient(135deg,#e74c3c,#c0392b);}
  button.acc{background:linear-gradient(135deg,#ffd166,#f39c12);color:#222;}

  .bingo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px;}
  .cell{
    aspect-ratio:1/1;background:var(--card);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:1.6rem;font-weight:700;cursor:pointer;border:2px solid transparent;
    position:relative;transition:.2s;padding:6px;text-align:center;
  }
  .cell:hover{border-color:var(--blue);}
  .cell.done{background:radial-gradient(circle at 50% 40%,#2ecc71,#0e7a3f);cursor:default;}
  .cell.done::after{content:"✓";font-size:2rem;position:absolute;color:#fff;opacity:.9;}
  .cell.done span{display:none;}
  .cell.active{border-color:var(--acc);box-shadow:0 0 20px rgba(255,209,102,.5);}
  .cell .qid{font-size:.7rem;color:#aab;position:absolute;top:6px;left:8px;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:18px;}
  .modal{background:var(--bg2);border-radius:18px;padding:26px;max-width:640px;width:100%;
    box-shadow:0 30px 80px rgba(0,0,0,.7);border:1px solid #3a4270;}
  .modal h3{margin-top:0;color:var(--acc);}
  .modal .opt{
    display:block;margin:8px 0;padding:12px 14px;border-radius:10px;
    background:#151a35;cursor:pointer;border:1px solid #2a3054;
  }
  .modal .opt:hover{border-color:var(--blue);}
  .modal .opt input{margin-right:10px;width:auto;}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .tabs button{background:#2a3054;}
  .tabs button.active{background:linear-gradient(135deg,#4a90e2,#7b5cff);}
  .panel{background:var(--card);border-radius:16px;padding:20px;}
  .q-editor{border:1px solid #3a4270;border-radius:12px;padding:14px;margin-bottom:12px;background:#1a1f38;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;}
  .row > *{flex:1;min-width:120px;}
  .small{font-size:.85rem;color:#aab;}

  .lb{list-style:none;padding:0;margin:0;}
  .lb li{display:flex;justify-content:space-between;padding:11px 14px;border-radius:10px;
    background:#1a1f38;margin-bottom:8px;border-left:4px solid var(--blue);}
  .lb li.me{border-left-color:var(--acc);background:#2a2640;}
  .lb .pts{font-weight:700;color:var(--acc);}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:200;}

  .win{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;
    justify-content:center;z-index:300;text-align:center;padding:20px;}
  .win .box{background:linear-gradient(135deg,#2b1e5e,#3a1f66);padding:40px;border-radius:24px;
    border:3px solid var(--acc);max-width:560px;box-shadow:0 0 80px rgba(255,209,102,.6);}
  .win h2{font-size:2.4rem;margin:0 0 12px;background:linear-gradient(90deg,#ffd166,#ff7b54,#ffd166);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 2s infinite;}
  @keyframes shine{0%{filter:brightness(1);}50%{filter:brightness(1.6);}100%{filter:brightness(1);}}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#2ecc71;color:#04240f;padding:12px 22px;border-radius:30px;font-weight:700;
    box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:250;}
  .toast.err{background:#e74c3c;color:#fff;}

  .set-item{display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;background:#1a1f38;border-radius:10px;margin-bottom:8px;
    border-left:4px solid var(--blue);flex-wrap:wrap;gap:8px;}
  .set-item .meta{font-size:.85rem;color:#aab;}

  #debug{position:fixed;bottom:0;left:0;right:0;max-height:120px;overflow:auto;
    background:#111;color:#f88;font-size:11px;padding:6px 10px;display:none;z-index:999;}

  @media(max-width:600px){
    .bingo-grid{gap:6px;}
    .cell{font-size:1.1rem;border-radius:10px;}
  }
</style>
</head>

    options:["word","wordt","worden","werd"], correct:"B" },

    options:["De fouten of gebreken van een ander opzettelijk verzwijgen of vergeven.","Iemand heel warm en hartelijk verwelkomen in een nieuw team.","Een geheim zakelijk voordeel geven aan een trouwe partner.","Iemand beschermen tegen terechte kritiek van buitenaf."], correct:"A" },
  { id:23, type:"mc", q:"Wat is de juiste spelling?",
    options:["onmiddellijk","onmiddelijk","onmidellijk","onmiddelijk"], correct:"A" },
  { id:24, type:"mc", q:"Wat betekent de uitdrukking 'een blauwtje lopen' in de Nederlandse taal?",
    options:["Een boete krijgen van iemand in een blauw uniform.","Afgewezen worden in de liefde.","Een blauwe plek oplopen tijdens een aanhouding.","Gezakt zijn voor de sporttest van de politieacademie."], correct:"B" },
  { id:25, type:"mc", q:"Wat betekent het spreekwoord 'Het einde kroont het werk'?",
    options:["Als je te snel werkt, maak je fouten aan het einde.","Je moet pas stoppen met werken als de koning daarvoor toestemming geeft.","Een goede voltooiing of een mooi resultaat is de mooiste beloning.","Alleen het laatste onderdeel van een project is belangrijk."], correct:"C" }
];

/* ============ STATE ============ */
const CLASSES = ["ALPHA","BRAVO","CHARLIE","DELTA","ECHO","FOXTROT","GOLF","HOTEL","JULIETT","KILO","LIMA","MIKE"];
let ME = { naam:"", klas:"", role:null, uid:null };
let QUESTIONS = [];
let STANDARD_SETS = {};
let CURRENT_GAME = { activeQuestion: null, started:false, winner:null };
let MY_CARD = [];
let MY_DONE = {};
let ALL_SCORES = {};
let listenersBound = false;
let booted = false;

/* ============ HELPERS ============ */
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err?' err':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function dbg(msg){
  const el = document.getElementById('debug');
  if(!el) return;
  el.style.display = 'block';
  el.textContent += msg + "\n";
}
window.addEventListener('error', e=> dbg('ERR: '+e.message));

/* ============ FIREBASE HELPERS ============ */
const saveQuestionSet   = qs  => window.fb.set(window.fb.ref(window.db,"bingo/questions"), qs);
const loadQuestionSet   = ()  => window.fb.get(window.fb.ref(window.db,"bingo/questions")).then(s=> s.val()||[]);
const saveGame          = g   => window.fb.set(window.fb.ref(window.db,"bingo/game"), g);
const loadGame          = ()  => window.fb.get(window.fb.ref(window.db,"bingo/game")).then(s=> s.val()||{});
const saveCard          = (u,c)=> window.fb.set(window.fb.ref(window.db,"bingo/cards/"+u), c);
const saveProgress      = (u,p)=> window.fb.set(window.fb.ref(window.db,"bingo/progress/"+u), p);
const saveScore         = (u,n,k,s)=> window.fb.set(window.fb.ref(window.db,"bingo/scores/"+u), {naam:n, klas:k, score:s, ts:Date.now()});
const loadStandardSets  = ()  => window.fb.get(window.fb.ref(window.db,"bingo/standardsets")).then(s=> s.val()||{});
const saveStandardSet   = (key, obj) => window.fb.set(window.fb.ref(window.db,"bingo/standardsets/"+key), obj);
const deleteStandardSet = (key) => window.fb.remove(window.fb.ref(window.db,"bingo/standardsets/"+key));

/* ============ ROUTING ============ */
function render(){
  try{
    if(!ME.uid){ renderLogin(); return; }
    if(ME.role === "teacher"){ renderTeacher(); return; }
    renderStudent();
  }catch(err){
    dbg('RENDER CRASH: '+err.message);
    console.error(err);
    // Toon nooit het inlogscherm als er al ingelogd is — toon foutmelding
    document.getElementById('app').innerHTML =
      `<div class="panel"><h2>Fout bij weergeven</h2><p class="small">${escapeHtml(err.message)}</p>
       <button class="ghost" onclick="location.reload()">Herladen</button></div>`;
  }
}

/* ============ LOGIN ============ */
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap">
      <h2>Inloggen</h2>
      <p class="small">Kies je klas en vul je naam in. Docent? Kies "Docent".</p>
      <select id="kls">
        ${CLASSES.map(c=>`<option value="${c}">${c}</option>`).join('')}
        <option value="DOCENT">Docent</option>
      </select>
      <input id="naam" placeholder="Jouw naam" autocomplete="off">
      <button id="btnLogin">Inloggen</button>
    </div>`;
  document.getElementById('btnLogin').onclick = async ()=>{
    const naam = document.getElementById('naam').value.trim();
    const klas = document.getElementById('kls').value;
    if(!naam) return toast("Vul je naam in", true);
    ME.naam = naam; ME.klas = klas;
    ME.role = klas === "DOCENT" ? "teacher" : "student";
    ME.uid  = (ME.role==="teacher" ? "docent_" : klas+"_") + naam.toLowerCase().replace(/\s+/g,'_');
    document.getElementById('who').textContent = (ME.role==="teacher"?"👩‍🏫 ":"🎓 ") + naam + " • " + klas;
    try{
      await initData();
    }catch(err){
      dbg('INIT CRASH: '+err.message);
      console.error(err);
      toast("Kon niet inloggen: "+err.message, true);
      return;
    }
    render();
  };
}

/* ============ DATA INIT ============ */
async function initData(){
  // Vragen & game eenmalig ophalen
  QUESTIONS   = await loadQuestionSet();
  CURRENT_GAME= await loadGame();
  STANDARD_SETS = await loadStandardSets();
  dbg('Data geladen. Vragen: '+QUESTIONS.length);

  // Kaart & voortgang voor student
  if(ME.role === "student"){
    try{
      const snap = await window.fb.get(window.fb.ref(window.db, "bingo/cards/"+ME.uid));
      if(snap.exists()) MY_CARD = snap.val();
      else { MY_CARD = makeCard(); await saveCard(ME.uid, MY_CARD); }
      const p = await window.fb.get(window.fb.ref(window.db, "bingo/progress/"+ME.uid));
      MY_DONE = p.exists() ? p.val() : {};
      dbg('Kaart: '+JSON.stringify(MY_CARD));
    }catch(err){ dbg('KAART FOUT: '+err.message); }
  }

  // Listeners slechts één keer koppelen
  if(listenersBound) return;
  listenersBound = true;

  window.fb.onValue(window.fb.ref(window.db,"bingo/game"), s=>{
    CURRENT_GAME = s.val() || {};
    if(ME.uid && ME.role==="student") render();
  });
  window.fb.onValue(window.fb.ref(window.db,"bingo/scores"), s=>{
    ALL_SCORES = s.val() || {};
    if(ME.uid) render();
  });
  window.fb.onValue(window.fb.ref(window.db,"bingo/questions"), s=>{
    QUESTIONS = s.val() || [];
    if(ME.uid && ME.role==="teacher") render();
  });
  window.fb.onValue(window.fb.ref(window.db,"bingo/standardsets"), s=>{
    STANDARD_SETS = s.val() || {};
    if(ME.uid && ME.role==="teacher") render();
  });
  if(ME.role === "student"){
    window.fb.onValue(window.fb.ref(window.db,"bingo/cards/"+ME.uid), s=>{
      if(s.exists() && ME.uid){ MY_CARD = s.val(); render(); }
    });
    window.fb.onValue(window.fb.ref(window.db,"bingo/progress/"+ME.uid), s=>{
      if(ME.uid){ MY_DONE = s.val() || {}; render(); }
    });
  }
}

/* ============ BINGOKAART ============ */
function makeCard(){
  const nums = Array.from({length:25},(_,i)=>i+1);
  for(let i=nums.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [nums[i],nums[j]]=[nums[j],nums[i]];
  }
  return nums;
}
function hasBingo(done, card){
  for(let r=0;r<5;r++) if([0,1,2,3,4].every(c=> done[card[r*5+c]] )) return true;
  for(let c=0;c<5;c++) if([0,1,2,3,4].every(r=> done[card[r*5+c]] )) return true;
  return false;
}

/* ============ STUDENT UI ============ */
function renderStudent(){
  const app = document.getElementById('app');
  if(!QUESTIONS.length){
    app.innerHTML = `<div class="panel"><h2>Wachten op vragen…</h2>
      <p class="small">De docent heeft nog geen vragenset ingevoerd.</p></div>`;
    return;
  }
  const doneCount = Object.keys(MY_DONE).length;
  const activeQ = CURRENT_GAME.activeQuestion;

  app.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <h2 style="margin:0;">Jouw bingokaart</h2>
      <div class="badge">Voortgang: ${doneCount} / 25</div>
    </div>
    <div class="bingo-grid" id="grid"></div>
    <div style="margin-top:24px;" class="panel">
      <h3>🏆 Leaderboard</h3>
      <ul class="lb" id="lb"></ul>
    </div>`;

  const grid = document.getElementById('grid');
  MY_CARD.forEach((qid, idx)=>{
    const cell = document.createElement('div');
    cell.className = 'cell' + (MY_DONE[qid] ? ' done':'');
    if(activeQ === qid && !MY_DONE[qid]) cell.classList.add('active');
    cell.innerHTML = `<span class="qid">#${idx+1}</span><span>${qid}</span>`;
    cell.onclick = ()=>{
      if(MY_DONE[qid]) return toast("Deze vraag heb je al goed!", true);
      if(activeQ !== qid) return toast("Deze vraag is nog niet actief. Wacht op de docent.", true);
      openQuestion(qid);
    };
    grid.appendChild(cell);
  });

  const lb = document.getElementById('lb');
  const arr = Object.values(ALL_SCORES).sort((a,b)=> b.score - a.score);
  if(!arr.length) lb.innerHTML = `<li class="small">Nog geen scores…</li>`;
  arr.forEach((s,i)=>{
    const li = document.createElement('li');
    if(s.naam === ME.naam && s.klas === ME.klas) li.classList.add('me');
    li.innerHTML = `<span>${i+1}. ${escapeHtml(s.naam)} <span class="small">(${escapeHtml(s.klas)})</span></span>
                    <span class="pts">${s.score} pt</span>`;
    lb.appendChild(li);
  });
}

function openQuestion(qid){
  const q = QUESTIONS.find(x=> x.id === qid);
  if(!q) return toast("Vraag niet gevonden", true);

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  let optsHtml = '';
  if(q.type === 'mc'){
    optsHtml = q.options.map((o,i)=>{
      const letter = String.fromCharCode(65+i);
      return `<label class="opt"><input type="radio" name="ans" value="${letter}">${letter}. ${escapeHtml(o)}</label>`;
    }).join('');
  } else {
    optsHtml = `<input id="shortAns" placeholder="Typ je antwoord…">`;
  }
  bg.innerHTML = `
    <div class="modal">
      <h3>Vraag ${qid}</h3>
      <p>${escapeHtml(q.q)}</p>
      ${optsHtml}
      <div class="row" style="margin-top:16px;">
        <button class="ok" id="btnSubmit">Insturen</button>
        <button class="ghost" id="btnCancel">Annuleren</button>
      </div>
      <p class="small" id="fb"></p>
    </div>`;
  document.body.appendChild(bg);

  document.getElementById('btnCancel').onclick = ()=> bg.remove();
  document.getElementById('btnSubmit').onclick = async ()=>{
    let given = '';
    if(q.type === 'mc'){
      const r = bg.querySelector('input[name=ans]:checked');
      if(!r) return document.getElementById('fb').textContent = "Kies een antwoord.";
      given = r.value;
    } else {
      given = (document.getElementById('shortAns').value || '').trim().toLowerCase();
      if(!given) return document.getElementById('fb').textContent = "Typ een antwoord.";
    }
    let correct = false;
    if(q.type === 'mc') correct = given.toUpperCase() === (q.correct||'').toUpperCase();
    else correct = given === (q.answer||'').trim().toLowerCase();

    if(correct){
      MY_DONE[qid] = true;
      await saveProgress(ME.uid, MY_DONE);
      const score = Object.keys(MY_DONE).length * 10;
      await saveScore(ME.uid, ME.naam, ME.klas, score);
      bg.remove();
      celebrate(qid);
      if(hasBingo(MY_DONE, MY_CARD)){
        await declareWinner();
      }
    } else {
      document.getElementById('fb').textContent = "❌ Helaas, dat is niet juist.";
    }
  };
}

function celebrate(qid){
  toast(`🎉 Vraag ${qid} goed!`);
  confettiBurst(120);
  // render() wordt al getriggerd door onValue op progress
}

/* ============ CONFETTI ============ */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resizeCanvas); resizeCanvas();

function confettiBurst(n=120, origin={x:innerWidth/2,y:innerHeight/2}){
  const colors = ['#ffd166','#ef476f','#06d6a0','#118ab2','#f78c6b','#a06cd5'];
  for(let i=0;i<n;i++){
    particles.push({
      x: origin.x, y: origin.y,
      vx: (Math.random()-0.5)*12,
      vy: (Math.random()-1)*10 - 2,
      size: 4+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.3,
      life: 90+Math.random()*60
    });
  }
  if(!confettiLoop) confettiLoop = requestAnimationFrame(drawConfetti);
}
let confettiLoop = null;
function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    ctx.restore();
  });
  particles = particles.filter(p=> p.life>0 && p.y < canvas.height+50);
  if(particles.length) confettiLoop = requestAnimationFrame(drawConfetti);
  else { confettiLoop = null; ctx.clearRect(0,0,canvas.width,canvas.height); }
}

/* ============ WINNAAR ============ */
async function declareWinner(){
  const res = await window.fb.runTransaction(window.fb.ref(window.db, "bingo/game/winner"), cur=>{
    if(cur) return cur;
    return {naam:ME.naam, klas:ME.klas, uid:ME.uid, ts:Date.now()};
  });
  const w = res.snapshot.val();
  if(w && w.uid === ME.uid) showWin();
}
function showWin(){
  const overlay = document.createElement('div');
  overlay.className = 'win';
  overlay.innerHTML = `
    <div class="box">
      <h2>🏆 BINGO! 🏆</h2>
      <p style="font-size:1.2rem;">Gefeliciteerd <b>${escapeHtml(ME.naam)}</b> uit klas ${escapeHtml(ME.klas)}!</p>
      <p>Jij hebt als eerste de hele bingokaart voltooid!</p>
      <button class="acc" onclick="this.closest('.win').remove()">Sluiten</button>
    </div>`;
  document.body.appendChild(overlay);
  let count = 0;
  const iv = setInterval(()=>{
    confettiBurst(80, {x:Math.random()*innerWidth, y:-20});
    if(++count > 15) clearInterval(iv);
  }, 250);
}

        <select id="selQ">
          ${QUESTIONS.map(q=>`<option value="${q.id}" ${activeQ===q.id?'selected':''}>Vraag ${q.id}: ${escapeHtml((q.q||'').substring(0,50))}${q.q.length>50?'…':''}</option>`).join('')}

    </div>`;

  const btnStart = document.getElementById('btnStart');
  if(btnStart) btnStart.onclick = async ()=>{
    await saveGame({...CURRENT_GAME, started:true, winner:null});
    toast("Spel gestart!");
  };
  const btnStop = document.getElementById('btnStop');

  };
  document.getElementById('btnReset').onclick = async ()=>{
    if(!confirm("Reset alle kaarten, voortgang en winnaar?")) return;
    await window.fb.set(window.fb.ref(window.db, "bingo/cards"), null);
    await window.fb.set(window.fb.ref(window.db, "bingo/progress"), null);

/* ---- Vragenbeheer ---- */
function renderQuestionsTab(c){
  c.innerHTML = `
    <div class="panel">
      <h2>Vragen invoeren</h2>
      <p class="small">Voer hier alle vragen in. Kies per vraag het type (multiple choice of kort antwoord).</p>
      <div class="row">
        <button class="acc" id="btnSeed">⚡ Laad standaardset (25 vragen)</button>
        <button class="ghost" id="btnAdd">+ Vraag toevoegen</button>
        <button class="ok" id="btnSave">💾 Opslaan in database</button>
        <button class="danger" id="btnClear">🗑 Alles wissen</button>
      </div>
      <div id="editor" style="margin-top:16px;"></div>
      <p class="small" id="status"></p>
    </div>`;
  const editor = document.getElementById('editor');
  let draft = JSON.parse(JSON.stringify(QUESTIONS));
  if(!draft.length) draft = [newQuestion(1)];

  function newQuestion(id){
    return { id, type:"mc", q:"", options:["","","",""], correct:"A", answer:"" };
  }
  function draw(){
    editor.innerHTML = draft.map((q,i)=>{
      const optInputs = q.options.map((o,j)=>
        `<input placeholder="Optie ${String.fromCharCode(65+j)}" value="${escapeHtml(o)}" data-i="${i}" data-j="${j}" class="optIn">`
      ).join('');
      const correctSel = `
        <select class="correctSel" data-i="${i}">
          ${['A','B','C','D'].map(l=>`<option value="${l}" ${q.correct===l?'selected':''}>${l}</option>`).join('')}
        </select>`;
      const shortInput = `<input class="shortIn" data-i="${i}" placeholder="Juiste antwoord" value="${escapeHtml(q.answer||'')}">`;
      return `
        <div class="q-editor">
          <div class="row">
            <b>Vraag ${q.id}</b>
            <select class="typeSel" data-i="${i}">
              <option value="mc" ${q.type==='mc'?'selected':''}>Multiple choice</option>
              <option value="short" ${q.type==='short'?'selected':''}>Kort antwoord</option>
            </select>
            <button class="danger delQ" data-i="${i}">Verwijderen</button>
          </div>
          <textarea class="qText" data-i="${i}" rows="2" placeholder="Vraagstelling…">${escapeHtml(q.q)}</textarea>
          <div class="row">${q.type==='mc' ? optInputs : shortInput}</div>
          ${q.type==='mc' ? `<div class="row"><span class="small">Correct:</span>${correctSel}</div>` : ''}
        </div>`;
    }).join('');

    editor.querySelectorAll('.qText').forEach(el=> el.oninput = e=>{
      draft[e.target.dataset.i].q = e.target.value;
    });
    editor.querySelectorAll('.typeSel').forEach(el=> el.onchange = e=>{
      draft[e.target.dataset.i].type = e.target.value; draw();
    });
    editor.querySelectorAll('.optIn').forEach(el=> el.oninput = e=>{
      draft[e.target.dataset.i].options[e.target.dataset.j] = e.target.value;
    });
    editor.querySelectorAll('.correctSel').forEach(el=> el.onchange = e=>{
      draft[e.target.dataset.i].correct = e.target.value;
    });
    editor.querySelectorAll('.shortIn').forEach(el=> el.oninput = e=>{
      draft[e.target.dataset.i].answer = e.target.value;
    });
    editor.querySelectorAll('.delQ').forEach(el=> el.onclick = e=>{
      draft.splice(e.target.dataset.i,1);
      draft.forEach((q,i)=> q.id = i+1);
      draw();
    });
  }
  draw();

  document.getElementById('btnSeed').onclick = async ()=>{
    if(!confirm("Dit vervangt de huidige editor-inhoud door de standaardset van 25 vragen. Doorgaan?")) return;
    draft = JSON.parse(JSON.stringify(SEED_SET));
    draw();
    document.getElementById('status').textContent = "Standaardset geladen in editor. Klik op 'Opslaan in database' om te bevestigen.";
  };
  document.getElementById('btnAdd').onclick = ()=>{
    draft.push(newQuestion(draft.length+1));
    draw();
  };
  document.getElementById('btnSave').onclick = async ()=>{
    for(const q of draft){
      if(!q.q.trim()) return toast("Vul alle vraagstellingen in", true);
      if(q.type==='mc'){
        if(q.options.some(o=>!o.trim())) return toast("Vul alle MC-opties in", true);
      } else {
        if(!q.answer || !q.answer.trim()) return toast("Vul het juiste korte antwoord in", true);
      }
    }
    draft.forEach((q,i)=> q.id = i+1);
    await saveQuestionSet(draft);
    QUESTIONS = draft;
    document.getElementById('status').textContent = "✔ Opgeslagen in database ("+draft.length+" vragen)";
    toast("Vragen opgeslagen!");
  };
  document.getElementById('btnClear').onclick = async ()=>{
    if(!confirm("Alle vragen uit de database verwijderen?")) return;
    await saveQuestionSet([]);
    draft = [newQuestion(1)];
    draw();
    toast("Database leeggemaakt");
  };
}

/* ---- Standaardsets ---- */
function renderSetsTab(c){
  const keys = Object.keys(STANDARD_SETS).sort((a,b)=> (STANDARD_SETS[b].ts||0) - (STANDARD_SETS[a].ts||0));
  c.innerHTML = `
    <div class="panel">
      <h2>📚 Standaardsets</h2>
      <p class="small">Sla de huidige vragenset op als standaardset, of laad een eerder opgeslagen set.</p>
      <div class="row">
        <input id="setNaam" placeholder="Naam van de set (bv. 'Bingo 2026 - versie 1')">
        <button class="ok" id="btnSaveSet">💾 Huidige vragenset opslaan als standaardset</button>
      </div>
      <div class="row">
        <button class="acc" id="btnSeedSet">⚡ Seed de originele 25-vragenset</button>
      </div>
      <hr style="border-color:#2a3054;margin:18px 0;">
      <h3>Opgeslagen sets (${keys.length})</h3>
      <div id="setsList"></div>
    </div>`;
  const list = document.getElementById('setsList');
  if(!keys.length){
    list.innerHTML = `<p class="small"><i>Nog geen standaardsets opgeslagen.</i></p>`;
  } else {
    list.innerHTML = keys.map(k=>{
      const s = STANDARD_SETS[k];
      return `<div class="set-item">
        <div>
          <b>${escapeHtml(s.naam || k)}</b>
          <div class="meta">${(s.questions||[]).length} vragen • opgeslagen ${new Date(s.ts||0).toLocaleString('nl-NL')}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="ok loadSet" data-key="${k}">📥 Laden in editor</button>
          <button class="ghost loadDirect" data-key="${k}">🚀 Direct activeren</button>
          <button class="danger delSet" data-key="${k}">🗑</button>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.loadSet').forEach(b=> b.onclick = async ()=>{
      const s = STANDARD_SETS[b.dataset.key];
      if(!s) return;
      await saveQuestionSet(s.questions||[]);
      QUESTIONS = s.questions||[];
      toast(`Set "${s.naam}" geladen in database`);
    });
    list.querySelectorAll('.loadDirect').forEach(b=> b.onclick = async ()=>{
      const s = STANDARD_SETS[b.dataset.key];
      if(!s) return;
      await saveQuestionSet(s.questions||[]);
      QUESTIONS = s.questions||[];
      await saveGame({ started:true, activeQuestion:null, winner:null });
      toast(`Set "${s.naam}" direct geactiveerd`);
    });
    list.querySelectorAll('.delSet').forEach(b=> b.onclick = async ()=>{
      if(!confirm("Deze standaardset verwijderen?")) return;
      await deleteStandardSet(b.dataset.key);
      toast("Set verwijderd");
    });
  }

  document.getElementById('btnSaveSet').onclick = async ()=>{
    if(!QUESTIONS.length) return toast("Er staan geen vragen in de database om op te slaan", true);
    const naam = (document.getElementById('setNaam').value || '').trim() ||
                 ("Set " + new Date().toLocaleString('nl-NL'));
    const key = "set_" + Date.now();
    await saveStandardSet(key, { naam, ts:Date.now(), questions:QUESTIONS });
    document.getElementById('setNaam').value = '';
    toast(`Standaardset "${naam}" opgeslagen`);
  };
  document.getElementById('btnSeedSet').onclick = async ()=>{
    if(!confirm("De originele 25-vragenset als standaardset toevoegen?")) return;
    const key = "seed_" + Date.now();
    await saveStandardSet(key, { naam:"Standaardset Basistaalvaardigheid (25)", ts:Date.now(), questions:SEED_SET });
    toast("Standaardset toegevoegd");
  };
}
